<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetelSpark</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1220">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #0f1220;
      --card: #1a1e33;
      --text: #eef0f8;
      --muted: #9aa0bd;
      --accent: #ff7a45;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6fb;
        --card: #ffffff;
        --text: #1b1e2e;
        --muted: #5d6380;
        --accent: #e5521b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0; font-size: 1.8rem; }
    .tagline { margin: 4px 0 20px; color: var(--muted); }
    .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .buttons button {
      padding: 18px 8px;
      border: 2px solid transparent;
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .buttons button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    #status { margin: 18px 0 8px; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 { margin: 0 0 6px; font-size: 1.05rem; }
    .card p { margin: 0 0 10px; color: var(--muted); }
    .card a { color: var(--accent); font-weight: 600; text-decoration: none; }
    footer { margin-top: 28px; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <h1>BetelSpark</h1>
    <p class="tagline">Dzienna dawka AI, Tech i Kosmosu</p>

    <div class="buttons">
      <button data-category="ai" aria-pressed="false">AI</button>
      <button data-category="tech" aria-pressed="false">Tech</button>
      <button data-category="kosmos" aria-pressed="false">Kosmos</button>
    </div>

    <p id="status">Wczytywanie…</p>
    <div id="news"></div>

    <footer>
      Streszczenia generuje AI i mogą zawierać błędy. Zawsze sprawdź źródło.
    </footer>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const newsEl = document.getElementById("news");
    const buttons = document.querySelectorAll(".buttons button");
    let data = null;

    function showCategory(category) {
      buttons.forEach((button) => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.category === category)
        );
      });

      newsEl.textContent = "";
      const items = (data && data[category]) || [];

      if (items.length === 0) {
        statusEl.textContent = "Brak świeżych wiadomości w tej kategorii.";
        return;
      }

      const updated = new Date(data.updated).toLocaleString("pl-PL", {
        dateStyle: "long",
        timeStyle: "short",
      });
      statusEl.textContent = "Aktualizacja: " + updated;

      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = item.title_pl || item.title;
        card.appendChild(title);

        const summary = document.createElement("p");
        summary.textContent = item.summary_pl || item.summary || "";
        card.appendChild(summary);

        if (item.link && item.link.startsWith("http")) {
          const link = document.createElement("a");
          link.href = item.link;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Czytaj źródło →";
          card.appendChild(link);
        }

        newsEl.appendChild(card);
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => showCategory(button.dataset.category));
    });

    async function load() {
      try {
        const response = await fetch("data.json", { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        data = await response.json();
        statusEl.textContent = "Wybierz kategorię powyżej.";
      } catch (error) {
        statusEl.textContent = "Nie udało się wczytać newsów. Spróbuj później.";
      }
    }

    load();
  </script>
</body>
</html>
